map_memory_node:
  ros__parameters:
    resolution: 0.1         # Match the local costmap's 10 cm cells.
    grid_size: 600          # 60 m x 60 m, centered on the world's origin.
    map_frame: sim_world   # World frame used by /odom/filtered.
    update_period_ms: 500  # Update and publish twice per second.
    max_pose_age: 0.5      # Maximum scan/pose time difference, in simulation seconds.
